name: sast-scan

on:
  push:
    branches: [githubcicd]

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '16.20.2'

      - name: Install dependencies
        run: npm ci --force

      - name: Download OWASP Dependency-Check
        run: |
          curl -fL --retry 3 \
            https://github.com/dependency-check/DependencyCheck/releases/download/v13.0.0/dependency-check-13.0.0-release.zip \
            -o "$RUNNER_TEMP/dependency-check.zip"
          unzip -q "$RUNNER_TEMP/dependency-check.zip" -d "$RUNNER_TEMP/odc"

      - name: Run OWASP Dependency-Check
        run: |
          chmod +x "$RUNNER_TEMP/odc/dependency-check/bin/dependency-check.sh"
          "$RUNNER_TEMP/odc/dependency-check/bin/dependency-check.sh" \
            --project "bitcoin" \
            --nvdDatafeed 'https://open-vulnerability-data-mirror-production.up.railway.app/nvdcve-{0}.json.gz' \
            --out . \
            --scan . \
            --disableOssIndex

      - name: Archive SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: ./dependency-check-report.html
          if-no-files-found: error

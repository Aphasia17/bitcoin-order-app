name: Bitcoin order App

on:
  push:
    branches:
      - githubcicd

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKSHOP6_GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '16.20.2'
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Build
        run: npm run build -- --base-href=/bitcoin-order-app/

      - name: Lint
        run: npm run lint

      # The workshop leaves unit tests disabled.
      # - name: Test
      #   run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Conventional Changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.WORKSHOP6_GITHUB_TOKEN }}
          output-file: 'false'
          skip-ci: 'true'

      - name: Create Release
        if: steps.changelog.outputs.skipped == 'false'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.WORKSHOP6_GITHUB_TOKEN }}
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.WORKSHOP6_GITHUB_TOKEN }}
        run: >
          npm run deploy --
          --name="github-actions[bot]"
          --email="41898282+github-actions[bot]@users.noreply.github.com"
